[package]
name = "lume"
version = "0.1.0"
description = "Biblioteca pessoal de filmes e séries"
authors = ["Aguiiiar"]
license = "MIT"
repository = "https://github.com/Aguiiiar/lume"
edition = "2021"
default-run = "lume"

[features]
smoke-test = []

[[bin]]
name = "lume"
path = "src/main.rs"

[[bin]]
name = "lume-check"
path = "src/smoke.rs"
required-features = ["smoke-test"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
sevenz-rust = { version = "0.6", default-features = false }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
